services:
  - type: web
    name: medical-cross-checker-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: EMBEDDING_MODEL
        value: BAAI/bge-small-en-v1.5
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: UPLOAD_DIR
        value: backend/uploads
      - key: CHROMA_PERSIST_DIR
        value: backend/data/chroma
      - key: SQLITE_DB_PATH
        value: backend/data/metadata.db
